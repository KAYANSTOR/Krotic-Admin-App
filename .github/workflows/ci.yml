name: Admin CI

on:
  push:
    branches: [main, feature/railway-whatsapp-qr-gateway, feature/railway-admin-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep main and each PR branch isolated; one branch must not cancel another branch's validation.
  group: krotak-admin-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install
      - name: Test admin unit suite
        run: npm test
      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore security rules
        run: npm run test:rules
      - name: Build admin dashboard
        run: npm run build
