services:
  - type: web
    name: krotak-whatsapp-qr-gateway-poc
    runtime: node
    region: frankfurt
    branch: تكامل-مزايا-المدفوعة
    plan: 0.5c-512mb
    rootDir: qr-gateway
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: whatsapp-qr-poc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_DATA_DIR
        value: /var/data
      - key: GATEWAY_MAX_SESSIONS
        value: "1"
      - key: GATEWAY_SERVICE_TOKEN
        sync: false
      - key: GATEWAY_VAULT_KEY_BASE64
        sync: false
      - key: GATEWAY_STATUS_CALLBACK_URL
        sync: false
